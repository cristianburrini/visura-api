services:
  visure-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: visura-api
    container_name: visure-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
      - DISPLAY=:99
      - 2FA_TIMEOUT_SECONDS=300
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
