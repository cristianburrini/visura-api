services:
  visure-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visure-api
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=API
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    stdin_open: true
    tty: true