services:
  visure-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: visura-api
    container_name: visure-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
      - DISPLAY=:99
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - ../logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  visure-mcp:
    build:
      context: ..
      dockerfile: visura_mcp/Dockerfile
    image: visura-mcp
    container_name: visure-mcp
    depends_on:
      - visure-api
    ports:
      - "8001:8001"
    environment:
      - VISURA_API_URL=http://visure-api:8000
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
    restart: unless-stopped
